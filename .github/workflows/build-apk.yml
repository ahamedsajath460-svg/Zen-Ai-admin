name: Zen AI Admin Studio - ZIP Auto APK Build

on:
  push:
    paths:
      - '**/*.zip'
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zen-admin-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Extract ZIP and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find ZIP uploaded in this commit
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep -Ei '\.zip$' | head -n 1 || true)"
          if [[ -z "$ZIP_PATH" ]]; then
            mapfile -t ZIPS < <(find . -maxdepth 4 -type f -iname '*.zip' -not -path './.git/*' | sort)
            if [[ "${#ZIPS[@]}" -eq 1 ]]; then
              ZIP_PATH="${ZIPS[0]}"
            else
              echo "Upload exactly one project ZIP per commit."
              printf '%s\n' "${ZIPS[@]}"
              exit 1
            fi
          fi
          test -f "$ZIP_PATH"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract ZIP and locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zen-admin-source"
          unzip -q "${{ steps.archive.outputs.zip_path }}" -d "$RUNNER_TEMP/zen-admin-source"
          GRADLEW="$(find "$RUNNER_TEMP/zen-admin-source" -type f -name gradlew -print -quit)"
          if [[ -z "$GRADLEW" ]]; then
            echo "ZIP is missing gradlew."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          if [[ ! -f "$PROJECT_DIR/settings.gradle" && ! -f "$PROJECT_DIR/settings.gradle.kts" ]]; then
            echo "Gradle settings file not found beside gradlew."
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare release signing keystore from GitHub Secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are missing."
            echo "Add KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD in repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PROJECT_DIR/my-upload-key.jks"
          test -s "$PROJECT_DIR/my-upload-key.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed Release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          KEYSTORE_PATH: my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zen-ai-admin-studio-release-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
